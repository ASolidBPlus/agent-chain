# The private chain, profile "chain" (spec S7).
#
#
# Run from this directory:  docker compose -f compose.chain.yml --profile chain up -d
services:
  chain:
    build:
      # Relative to THIS FILE, not the working directory. Spec S7 writes
      # ./chain/docker, which is correct only if the compose file sits at the
      # hub-stack root; this file sits at the root of its own repo, so the
      # context is ./docker. Flagged for the spec to be corrected.
      context: ./docker
      dockerfile: anvil.Dockerfile
    profiles: [chain]
    environment:
      # Fails at `compose up` with this message rather than starting a chain
      # whose treasury key came from an empty seed.
      # Note: `:?` makes every compose subcommand (ps, down, logs) require the
      # variable too. In the hub stack it comes from .env so this is invisible;
      # standalone, export it first. Accepted: an empty phrase is a
      # shared treasury key, which is worse than a startup error.
      ANVIL_MNEMONIC: "${ANVIL_MNEMONIC:?ANVIL_MNEMONIC must be set in the hub .env - it derives the treasury key}"
    # FINDING 27. Neither flag is a mitigation for a threat this stack has; both
    # remove a capability nothing here uses, so the cost of being wrong later is
    # paid now instead.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # READ-ONLY ROOT: anvil writes its state file and nothing else, and that
    # file is on a volume. A tmpfs for /tmp because a read-only root with no
    # writable temp is a container that fails in ways nobody can read.
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - chain-state:/state
    # NO HOST BINDING. The `front` service publishes 8545 and mediates every
    # request; a loopback binding here would still be reachable by any browser
    # running on the host, which is the same reach the front exists to control -
    # so a filter beside a published node port would be decorative.
    #
    # Admin access to the node is now "you have docker on this host": `compose
    # exec chain cast ...`, or attach to the network. That is the intended bar,
    # and it is the answer to somebody looking for the old port.
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 5s

  # One-shot: deploys the contracts, writes deployments/local.json, exits 0.
  # chain-svc waits for it with service_completed_successfully, so the service
  # never starts against a chain with no contracts on it.
  #
  # Reuses the anvil image because it already carries forge and cast; building
  # a second Foundry image to run one script would be waste. Spec S7 folded
  # this into chain-svc's own image and command - separated so the service that
  # holds the wallet keys does not also ship a Solidity toolchain.
  chain-deploy:
    build:
      context: ./docker
      dockerfile: anvil.Dockerfile
    profiles: [chain]
    depends_on:
      chain:
        condition: service_healthy
    environment:
      ANVIL_MNEMONIC: "${ANVIL_MNEMONIC:?ANVIL_MNEMONIC must be set in the hub .env - it derives the treasury key}"
      # Forge's three write paths, off the read-only source tree.
      #
      # THREE, not the two the finding named, and the third was found by running
      # it rather than by reading: `forge script --broadcast` saves a
      # transaction sequence to `broadcast/<script>/<chainid>/run-latest.json`,
      # and with the source mounted :ro the deploy died AFTER simulating
      # successfully -
      #
      #   ERROR forge_script::sequence: could not save deployment sequence
      #   err=failed to create file "/contracts/broadcast/.../run-latest.json":
      #   Read-only file system (os error 30)
      #
      # - which `docker compose config` cannot see and a unit test cannot reach.
      # Naming only OUT leaves the cache behind, naming only those two leaves
      # the broadcast log behind, and each one is written on every run.
      FOUNDRY_OUT: /tmp/forge-out
      FOUNDRY_CACHE_PATH: /tmp/forge-cache
      FOUNDRY_BROADCAST: /tmp/forge-broadcast
    # FINDING 27. Neither flag is a mitigation for a threat this stack has; both
    # remove a capability nothing here uses, so the cost of being wrong later is
    # paid now instead.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # NOT read_only: `forge` writes its build output and cache, which findings
    # 26 points at /tmp - and a tmpfs for those is sized wrong the first time
    # somebody adds a contract. The one directory it must write outside /tmp is
    # `deployments/`, which is the bind mount below and the reason this service
    # exists.
    tmpfs:
      - /tmp
    volumes:
      # FINDING 26: THE SOURCE IS READ-ONLY, and forge's scratch moves off it.
      # `forge script` writes `out/` and `cache/` beside the sources by default,
      # so a container build left root-owned artefacts in the developer's tree -
      # which is a nuisance until the day the tree is a checkout somebody else
      # verifies, and then it is a container writing into the thing under test.
      # `deployments/` stays WRITABLE here: this is the service that promotes
      # local.json.pending, and it is the only one.
      - ./contracts:/contracts:ro
      - ./deployments:/deployments
    # Account 0 of the mnemonic is the deployer and the treasury (spec S2), so
    # the key is derived in the script rather than being a second secret to keep
    # in step.
    #
    # THE SCRIPT IS A FILE, NOT AN INLINE BLOCK. It writes the manifest to
    # `local.json.pending` and promotes it only after a successful broadcast, so
    # a simulation cannot leave the rest of the system believing in contracts
    # that were never mined - which is more logic than a `command:` block can
    # carry reviewably, and it is also the file someone will run by hand when a
    # promotion fails.
    entrypoint: ["/bin/sh", "/usr/local/bin/deploy-once.sh"]

  chain-svc:
    build:
      # The repo root: svc is a bun workspace member and the lockfile lives
      # there, so --frozen-lockfile is only possible from the root.
      context: .
      dockerfile: svc/Dockerfile
    profiles: [chain]
    depends_on:
      chain:
        condition: service_healthy
      chain-deploy:
        condition: service_completed_successfully
    environment:
      RPC_URL: http://chain:8545
      CHAIN_SVC_TOKEN: "${CHAIN_SVC_TOKEN:?CHAIN_SVC_TOKEN must be set in the hub .env}"
      KEYSTORE_SECRET: "${KEYSTORE_SECRET:?KEYSTORE_SECRET must be set in the hub .env}"
      ANVIL_MNEMONIC: "${ANVIL_MNEMONIC:?}"
      DEPLOYMENTS_DIR: /deployments
      KEYSTORE_DIR: /keystore
      POLICY_DIR: /policies
      STORE_PATH: /store/chain-svc.sqlite
      HUB_CORE_URL: "${HUB_CORE_URL:-}"
    # FINDING 27. Neither flag is a mitigation for a threat this stack has; both
    # remove a capability nothing here uses, so the cost of being wrong later is
    # paid now instead.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # READ-ONLY ROOT: every write chain-svc makes is to one of the three
    # volumes below - the keystore, the policy directory and the sqlite store -
    # which is the same "three volumes, one lifetime" that the ledger control
    # already depends on. If that ever stops being true, this line is what says
    # so, loudly, on the first boot after the change.
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - keystore:/keystore
      - policies:/policies
      - svc-store:/store
      # FINDING 26: READ-ONLY. chain-svc READS the deployment manifest at boot
      # and never writes it - the deploy one-shot above owns that file, and it
      # is the one service that needs the directory writable. A service that
      # cannot write a file it has no reason to write cannot corrupt it when
      # something goes wrong inside it.
      - ./deployments:/deployments:ro
    # KEPT, DELIBERATELY, and it is the only service outside the front that
    # publishes anything.
    #
    # The node lost its binding because the front mediates it and a published
    # node port is admin access. Neither is true here: this service authenticates
    # every request with a bearer token, and nothing fronts it - so unpublishing
    # it would not move the access somewhere safer, it would make the stack
    # unusable out of the box, since this API is how the whole system is driven.
    #
    # Stated rather than inherited, because a binding nobody decided to keep is
    # indistinguishable from one nobody noticed. A deployment that wants this
    # unreachable removes the binding - which is why the other services ship with
    # none: an override can ADD a port binding by merging but cannot take one
    # away without `!override`, so a default binding is a floor every consumer
    # inherits, and a default absence is a choice each one makes.
    ports:
      - "127.0.0.1:7000:7000"

  # The block explorer. Raw addresses; a names-aware view over /history,
  # /resolve and /reverse is a later frontend.
  otterscan:
    image: otterscan/otterscan:v2.11.0@sha256:7636f835fcdfc550c205a78876013d6e54c95846f3566e59cc71bc6136c80cc9
    profiles: [chain]
    depends_on:
      chain:
        condition: service_healthy
    # NO ERIGON_URL HERE ANY MORE. This image's entrypoint writes the value into
    # its own config.json, but the front answers `= /config.json` itself and an
    # exact-match location wins over the prefix that proxies here - so nothing
    # ever fetches this image's copy. Measured: the served config.json carries
    # the front's derived value, not this one. It is removed rather than left,
    # because a setting that still names a port the node no longer publishes is
    # worse than no setting at all.
    # FINDING 27, and this is the service where "drop ALL" is not free.
    #
    # nginx starts as root, chowns its cache directories and drops to the
    # `nginx` user - so with every capability gone it dies before it serves:
    #
    #   [emerg] chown("/var/cache/nginx/client_temp", 101) failed
    #           (1: Operation not permitted)
    #
    # Measured by starting it, not by reading the Dockerfile. So: drop
    # everything and add back the four it demonstrably uses - CHOWN for the
    # cache directories, SETUID and SETGID to become `nginx`, NET_BIND_SERVICE
    # for port 80. That is still far less than the default set, and every entry
    # names a thing this image does at startup rather than a thing it might.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    # NOT read_only: the same startup writes its cache and pid paths under /var,
    # and a tmpfs for each would be guessing at sizes. Stated rather than left
    # blank, so the asymmetry with the other three reads as a decision.
    #
    # NO HOST BINDING either: the front proxies it, so the explorer and the RPC
    # it calls are the same origin. That is what makes `erigonURL` correct
    # through an ssh forward or any other address a viewer reaches it by - a
    # value baked at deploy time is wrong for every route except the one it was
    # baked for.

  # Everything a browser or an external caller touches. nginx with njs, from the
  # explorer's own image - so this adds a container and no new dependency.
  #
  # Three jobs: publish the JSON-RPC behind a method allowlist, serve the
  # explorer same-origin with a `config.json` rewritten per request, and render
  # the overview pages under /overview.
  front:
    image: otterscan/otterscan:v2.11.0@sha256:7636f835fcdfc550c205a78876013d6e54c95846f3566e59cc71bc6136c80cc9
    profiles: [chain]
    depends_on:
      chain:
        condition: service_healthy
    entrypoint: ["/entrypoint.sh"]
    environment:
      # A comma list; a trailing `*` is a prefix and `*` alone is pass-through,
      # so filtered and unfiltered are the same code path rather than two.
      #
      # NOT `eth_*`. That prefix was here until it was measured: the eth_ namespace
      # on anvil is not a read namespace. It carries `eth_sendTransaction`,
      # `eth_sign`, `eth_signTransaction`, three `eth_signTypedData` variants,
      # `eth_sendRawTransaction` and `eth_sendUnsignedTransaction`, and this node
      # holds the treasury key unlocked - so the published RPC looked filtered and
      # was an unauthenticated console onto the treasury. Measured on the pinned
      # image: `eth_sendUnsignedTransaction` moved treasury funds with no signature
      # and from an address the node never held a key for, and because anvil runs
      # here with `--gas-price 0 --base-fee 0`, `eth_sendRawTransaction` alone let
      # an unfunded stranger deploy a contract. Both while `anvil_setBalance`
      # returned -32601 throughout, which is what made it look filtered.
      #
      # The entries are what the EXPLORER needs, measured rather than read off its
      # source: docker/verify-front.sh drives a real browser over the landing,
      # block, block-txs, transaction and address pages and reports what the filter
      # refused. Reading the explorer's bundle instead gives a list that includes
      # `eth_sendTransaction` and `eth_sign`, because the bundle carries a whole
      # ethers provider; the browser is the only thing that says which are called.
      #
      # `ots_*` stays a PREFIX: the whole namespace is read-only and
      # anvil-implemented, so the prefix costs nothing and a page nobody drove does
      # not become a support question. (`ots2_*` is NOT covered by it and is not
      # implemented by this anvil either, so those pages degrade with or without.)
      # The filter refuses the eight signing and submitting methods underneath any
      # allowlist anyway, unless the value is a bare `*`.
      RPC_ALLOWED_METHODS: "${RPC_ALLOWED_METHODS:-net_version,web3_clientVersion,ots_*,erigon_getHeaderByNumber,eth_chainId,eth_blockNumber,eth_getBalance,eth_getCode,eth_getStorageAt,eth_getTransactionCount,eth_getBlockByNumber,eth_getBlockByHash,eth_getBlockReceipts,eth_getBlockTransactionCountByNumber,eth_getBlockTransactionCountByHash,eth_getTransactionByHash,eth_getTransactionByBlockNumberAndIndex,eth_getTransactionByBlockHashAndIndex,eth_getTransactionReceipt,eth_getLogs,eth_call,eth_estimateGas,eth_gasPrice,eth_maxPriorityFeePerGas,eth_feeHistory,eth_blobBaseFee,eth_syncing,eth_getProof,eth_createAccessList}"
      RPC_ALLOW_ORIGIN: "${RPC_ALLOW_ORIGIN:-*}"
      OVERVIEW_BLOCKS: "${OVERVIEW_BLOCKS:-10}"
      # 0 disables the page's inline poll entirely - markup with nothing to run,
      # for a deployment that wants no scripting at all.
      OVERVIEW_POLL_SECONDS: "${OVERVIEW_POLL_SECONDS:-5}"
      # WHERE THE FRONT POINTS AND WHERE IT LISTENS, as values. These defaults
      # are what the config used to hard-code, so this deployment is unchanged.
      # A deployment that runs everything in one network namespace has no
      # `chain` to resolve and no free choice of port: it sets these. Changing
      # a listen port means changing the mapping below to match.
      NODE_UPSTREAM: "${NODE_UPSTREAM:-http://chain:8545}"
      OTTERSCAN_UPSTREAM: "${OTTERSCAN_UPSTREAM:-http://otterscan:80}"
      FRONT_HTTP_PORT: "${FRONT_HTTP_PORT:-80}"
      FRONT_RPC_PORT: "${FRONT_RPC_PORT:-8545}"
      # Empty means "derive it from the request", which is right for compose and
      # for an ssh forward. A deployment behind a gateway that rewrites Host
      # states its public RPC address here instead.
      ERIGON_URL: "${ERIGON_URL:-}"
    volumes:
      - ./docker/front/rpc-proxy.conf.template:/etc/nginx/rpc-proxy.conf.template:ro
      - ./docker/front/entrypoint.sh:/entrypoint.sh:ro
      - ./docker/front/rpc_filter.js:/etc/nginx/njs/rpc_filter.js:ro
      - ./docker/front/overview.js:/etc/nginx/njs/overview.js:ro
      # READ-ONLY, and the overview reads the registry's address out of it per
      # request. The deploy one-shot owns this file; nothing here writes it.
      - ./deployments:/deployments:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The same four the explorer needs, and for the same reason: nginx starts as
    # root, chowns its cache and drops to `nginx`. Measured on that image at
    # v0.9.0, and this service is the same image.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    ports:
      # The published surface, on loopback by default so a developer's local
      # experience is unchanged and only the mediation moved. A deployment that
      # wants these reachable overrides the binding.
      - "127.0.0.1:8545:8545"
      - "127.0.0.1:5100:80"

volumes:
  chain-state: {}
  keystore: {}
  policies: {}
  svc-store: {}

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

# Dependencies are git submodules pinned in foundry.lock. A plain `git clone`
# of mesh-agent does NOT fetch them and `forge test` will fail on the imports:
#   git submodule update --init --recursive chain/contracts/lib
# Nothing outside chain/ needs them - `bun test` is unaffected either way.

# Pinned deliberately (spec S3.2): an exact solc and a fixed EVM version so a
# rebuild months from now produces the same bytecode as the one that was
# reviewed. Do not relax either to "latest" without saying so in the PR.
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Deploy.s.sol writes deployments/local.json, which lives outside this package
# (spec S1 puts it at chain/deployments/). DEPLOYMENTS_DIR overrides the path;
# compose points it at /deployments.
fs_permissions = [{ access = "read-write", path = "../deployments" }]

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

# Invariant runs: every handler action is guarded so it cannot revert, so a
# revert means the handler's model of what is legal has drifted from the
# contract's - which is a finding, not noise. Hence fail_on_revert. This table
# must stay AFTER the [profile.default] keys above; a second [profile.default]
# header is a duplicate-key error rather than a merge.
[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

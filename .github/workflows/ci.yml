# Reproduced from mesh-agent's ci.yml at the split (dev @ 822bd20), minus the
# two mesh-agent-only steps: the arena bundle check and gate.sh's self-test.
# Neither has anything in this repo to act on.
#
# NO `submodules:` here, and that is deliberate rather than an omission -
# contracts.yml says why. With the Foundry submodules present, bun discovers
# OpenZeppelin's own Hardhat suite; bunfig.toml ignores that path, and keeping
# the checkouts separate means the two jobs cannot re-break each other.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege, set explicitly rather than inherited: this job only reads the
# tree. Anything that needs more should ask for it at the job that needs it.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The runtime is pinned for the same reason the actions are: an unpinned
      # `latest` is the larger supply-chain surface of the two, and it makes a red
      # run unreproducible — the toolchain can differ between a failure and its retry.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      # --frozen-lockfile so a PR can't silently drift the dependency set,
      # and --ignore-scripts so a dependency's install hook can't run in CI.
      - run: bun install --frozen-lockfile --ignore-scripts
      # Typecheck every package, DISCOVERED rather than enumerated, and assert
      # that no .ts file is parsed by nothing. There is no root tsconfig in this
      # repo - svc and wallet-mcp carry their own, and the script finding both is
      # what makes that safe rather than a gap.
      - run: bun run typecheck:all
      # Invoke the package script rather than `bun test` directly, so CI and
      # `bun run test` can't drift into two different definitions of "the tests".
      - run: bun run test

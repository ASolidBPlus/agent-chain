# The Solidity half of CI. A SEPARATE workflow from ci.yml on purpose, for two
# reasons:
#
#   1. Its checkout needs `submodules: recursive` (Foundry vendors OpenZeppelin
#      under contracts/lib). ci.yml's `bun test` job must NOT share that
#      checkout: with the submodules present, bun discovers OpenZeppelin's own
#      Hardhat suite and fails ~160 of someone else's tests. bunfig.toml ignores
#      that path, but keeping the checkouts separate means the two jobs cannot
#      re-break each other by accident.
#   2. A separate file cannot conflict with edits to ci.yml, which is being
#      changed independently.
#
# Deliberately NOT path-filtered to contracts: a filter that is wrong
# fails toward "did not run", and a job that silently stops running is worse
# than one that runs when it did not need to.
name: Contracts

on:
  push:
    branches: [main]
  pull_request:

# LEAST PRIVILEGE, SET EXPLICITLY rather than inherited, as ci.yml already does.
# Without this the workflow gets the repository's default token permissions,
# which on a public repo is read-only today and is a REPOSITORY SETTING somebody
# can widen from a web form - so the job's authority would change without a diff.
# Neither job here writes anything; both read a tree and run a build.
permissions:
  contents: read

# FFI OFF, STATED. Foundry's FFI lets a test shell out, and `forge test` runs
# every file under test/ including any a dependency update drags in. foundry.toml
# does not enable it, so this changes nothing today - which is the point: it
# makes "this workflow does not execute arbitrary commands on our runner" a
# property of the WORKFLOW rather than of a config file two directories away
# that a future edit could flip without anyone reading this file.
env:
  FOUNDRY_FFI: false

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          # Pinned to the version the contracts were written and reviewed
          # against; foundry.toml pins solc and the EVM version to match.
          version: v1.8.1

      - name: forge test
        working-directory: contracts
        run: forge test -vv

      # Coverage is reported, not gated: a threshold here would be a number
      # someone games rather than a property anyone checks. The mutation
      # evidence in the PR body is what speaks to whether the tests can fail.
      - name: forge coverage (reported, not enforced)
        working-directory: contracts
        run: forge coverage --no-match-coverage "script/" || true

  abi-drift:
    # svc ships a GENERATED src/abi.ts, committed because chain-svc's
    # image carries no contract build output and `bun test` must run without
    # Foundry. That trade is only safe if something notices when the ABI and the
    # committed copy diverge - this job is that something.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # PINNED, as in ci.yml. `latest` makes the toolchain a moving part of
          # every run: a bun release changes what this job does with no commit
          # to point at, and the one job whose output is COMMITTED to the repo
          # is the worst place for that - a regenerated abi.ts would differ for
          # a reason nobody could find in the diff.
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile --ignore-scripts

      # THE GATE'S GUARANTEE, MADE INTO A STEP RATHER THAN LEFT AS A PROPERTY
      # OF THE RUNNER. `out/` is gitignored, so a fresh checkout has none and
      # the build below is already clean today - but that is an accident of
      # nobody having cached it yet, and adding a build cache is exactly the
      # kind of performance edit that gets reviewed as a performance edit.
      #
      # It matters because `forge build` ADDS to out/ and never removes from it:
      # the artefact of a contract deleted from a source file that still exists
      # survives, keeps its `src/` compilation target, and passes both of
      # generate-abi's filters. The clean build is what catches a deleted
      # CONTRACT; the filters catch a deleted FILE.
      - name: start from an empty out/
        working-directory: contracts
        run: rm -rf out

      - name: forge build
        working-directory: contracts
        run: forge build

      - name: regenerate the committed ABI
        working-directory: svc
        run: bun run scripts/generate-abi.ts

      # THE GENERATOR AND THE CONTRACTS MUST NOT MOVE IN ONE PR, and this is
      # the step that says so.
      #
      # The check below compares the committed abi.ts to what the generator
      # produces. That is a comparison between the ABI and ITSELF-AS-GENERATED:
      # it cannot see a change that alters both. A PR that edits a contract AND
      # edits the generator so the new output still matches passes this gate
      # while the thing the gate exists to notice - the ABI drifting from the
      # contracts - has happened.
      #
      # So the two are not allowed in one change. Separated, each is gated by
      # the other's unchanged half: a contract change is checked by the old
      # generator, and a generator change regenerates against unchanged
      # contracts and shows its own diff.
      - name: refuse a generator change beside a contract change
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then echo "not a pull request; nothing to compare"; exit 0; fi
          git fetch --no-tags --depth=1 origin "$base"
          # TWO DOTS, NOT THREE. `a...b` asks git for the MERGE BASE of a and b,
          # and a shallow checkout has no common ancestor to find - the step
          # failed with "no merge base" and exit 128 the first time it ran.
          # Two dots compares the two commits directly, which is what is wanted:
          # `base` is already the merge base GitHub computed for the PR.
          changed=$(git diff --name-only "$base" HEAD)
          gen=$(echo "$changed" | grep -c '^svc/scripts/generate-abi\.ts$' || true)
          src=$(echo "$changed" | grep -c '^contracts/src/' || true)
          if [ "$gen" -gt 0 ] && [ "$src" -gt 0 ]; then
            echo "::error::This PR changes svc/scripts/generate-abi.ts AND contracts/src. Split them: the ABI gate compares the committed file to this generator's output, so a PR that moves both can pass while the ABI and the contracts diverge."
            exit 1
          fi

      # `HEAD --` rather than a bare path: without an explicit commit, `git diff`
      # compares the WORKING TREE to the INDEX, so a change that was somehow
      # staged would be invisible to it. Against HEAD the comparison is to what
      # is committed, which is what the guarantee is about.
      - name: fail if the committed ABI no longer matches the contracts
        run: |
          if ! git diff --exit-code HEAD -- svc/src/abi.ts; then
            echo "::error::svc/src/abi.ts is stale. Run 'cd svc && bun run scripts/generate-abi.ts' and commit the result."
            exit 1
          fi
